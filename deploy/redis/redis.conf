# 仅供本地/测试环境示例。生产环境需启用密码/ACL、网络隔离、监控与备份。
port 6379
protected-mode no
bind 0.0.0.0

# 本地测试内存上限示例；大型快照压测前请按数据规模和 Docker 内存实际调整。
maxmemory 512mb
# 点赞集合和 Stream 都是状态数据，禁止被 maxmemory 策略静默淘汰；达到上限时写请求会报错而非淘汰数据。
maxmemory-policy noeviction

# AOF 持久化。everysec 性能和耐久性折中；主机突然断电时可能丢失最近约 1 秒的写日志。
appendonly yes
appendfsync everysec

# 同时保留 RDB 快照作为额外恢复手段。
save 900 1
save 300 10
save 60 10000

tcp-keepalive 60
timeout 0
