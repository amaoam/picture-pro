# 服务器基础配置
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000 # Cookie有效期30天（单位：秒）
  session:
    timeout: 2592000 # 服务端会话超时（Spring Session下不生效）

# Spring 核心公共配置
spring:
  profiles:
    active: local
  devtools:
    restart:
      enabled: false # 关闭热部署自动重启
  application:
    name: picture-backend-pro
  servlet:
    multipart:
      max-file-size: 2MB # 单个上传文件最大大小
      max-request-size: 10MB # 单次请求总大小
  # Spring Session 会话配置
  session:
    store-type: redis
    timeout: 2592000 # 会话过期30天

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL日志
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j 接口文档
knife4j:
  enable: true
  openapi:
    title: "图床系统接口文档"
    version: "1.0"
    group:
      default:
        group-name: "默认分组"
        api-rule: package
        api-rule-resources:
          - com.zmt.picturebackendpro.controller

# 腾讯云 COS 对象存储
cos:
  client:
    host:
    secretId:
    secretKey:
    region:
    bucket:

# 阿里云 AI 配置
aliYunAi:
  apiKey:
  
#社区等级配置 
community:
  experience:
    post-reward: 10
    comment-reward: 2
    received-like-reward: 1
    daily-post-cap: 30
    daily-comment-cap: 20
    level-thresholds: 0,100,300,600,1000,1500,2200,3000,4000,5500
    zone-id: Asia/Shanghai
  like:
    outbox:
      # 初始压测参数：每个消费者每隔约 100ms 领取一批；共有 4 个调度 worker。
      poll-delay-ms: 100
      batch-size: 200
      max-retries: 10