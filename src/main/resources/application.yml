# 服务器基础配置
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000 # Cookie有效期30天（单位：秒）
  session:
    timeout: 2592000 # 服务端会话超时（使用Spring Session时此配置不生效）

# Spring 核心配置
spring:
  devtools:
    restart:
      enabled: false # 关闭热部署自动重启
  application:
    name: yu-picture-backend-try # 应用名称
  servlet:
    multipart:
      max-file-size: 2MB # 单个上传文件最大大小
      max-request-size: 10MB # 单次请求总大小（建议补充，避免多文件上传报错）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_picture?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  # Redis 配置
  redis:
    database: 1 # Redis 数据库索引
    host: 127.0.0.1 # Redis 服务器地址
    port: 6379 # Redis 服务端口
    # password: # 无密码保持注释即可
    timeout: 10s # 连接超时时间
    lettuce:
      pool:
        max-active: 200 # 连接池最大连接数
        max-wait: -1ms # 最大阻塞等待时间，负值表示无限制
        max-idle: 10 # 最大空闲连接数
        min-idle: 0 # 最小空闲连接数
  # Spring Session 会话配置
  session:
    store-type: redis # 会话存储到 Redis
    timeout: 2592000 # 会话过期时间30天（优先级高于 server.session.timeout）

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false # 关闭下划线自动转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开发环境打印SQL日志
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除字段名
      logic-delete-value: 1 # 逻辑已删除值
      logic-not-delete-value: 0 # 逻辑未删除值

# Knife4j 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: "1.0"
    group:
      default:
        group-name: "默认分组"
        api-rule: package
        api-rule-resources:
          - com.zmt.picturebackendpro.controller

# 腾讯云 COS 对象存储配置（需自行填入密钥）
cos:
  client:
    host:
    secretId:
    secretKey:
    region:
    bucket:

# 阿里云 AI 配置（需自行填入密钥）
aliYunAi:
  apiKey: 
