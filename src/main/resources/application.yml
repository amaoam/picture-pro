# 服务器基础配置
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000 # Cookie有效期30天（单位：秒）
  session:
    timeout: 2592000 # 服务端会话超时（Spring Session下不生效）

# Spring 核心公共配置
spring:
  profiles:
    active: local
  devtools:
    restart:
      enabled: false # 关闭热部署自动重启
  application:
    name: picture-backend-pro
  servlet:
    multipart:
      max-file-size: 2MB # 单个上传文件最大大小
      max-request-size: 10MB # 单次请求总大小
  # Spring Session 会话配置
  session:
    store-type: redis
    timeout: 2592000 # 会话过期30天

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL日志
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j 接口文档
knife4j:
  enable: true
  openapi:
    title: "图床系统接口文档"
    version: "1.0"
    group:
      default:
        group-name: "默认分组"
        api-rule: package
        api-rule-resources:
          - com.zmt.picturebackendpro.controller

# 腾讯云 COS 对象存储
cos:
  client:
    host:
    secretId:
    secretKey:
    region:
    bucket:

# 阿里云 AI 配置
aliYunAi:
  apiKey:
  
#社区等级配置 
community:
  experience:
    post-reward: 10
    comment-reward: 2
    received-like-reward: 1
    daily-post-cap: 30
    daily-comment-cap: 20
    level-thresholds: 0,100,300,600,1000,1500,2200,3000,4000,5500
    zone-id: Asia/Shanghai
  like:
    outbox:
      # 删除/替换旧 poll-delay-ms；V2.2 改为以下自适应参数。
      workers: 4
      idle-min-poll-delay-ms: 25
      idle-max-poll-delay-ms: 500
      busy-poll-delay-ms: 1
      error-poll-delay-ms: 1000
      poll-jitter-percent: 10
      initial-worker-stagger-ms: 25
      # target-batch-size、max-events-per-target、max-retries 保留 V2.1 的原值
# Spring Boot Actuator / Prometheus。生产环境应通过网络策略限制这些端点的访问。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        "http.server.requests": true
        "community.like.outbox.batch.duration": true
        "community.like.outbox.poll.duration": true