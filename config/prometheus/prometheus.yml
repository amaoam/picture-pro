global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Spring Boot runs on the Windows host. Prometheus runs in Docker Desktop.
  # Keep this job name in sync with -PrometheusJob in the benchmark PowerShell script.
  - job_name: picture-backend
    metrics_path: /api/actuator/prometheus
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ["host.docker.internal:8123"]
        labels:
          application: picture-backend
